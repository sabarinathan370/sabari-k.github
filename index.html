<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Bus Reservation</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
    }

    header {
        text-align: center;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
        letter-spacing: 2px;
        background: rgba(0,0,0,0.3);
    }

    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px;
        gap: 30px;
    }

    .card {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .form-section input, .form-section select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: none;
    }

    .btn {
        background: #ff9800;
        padding: 10px;
        border: none;
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn:hover {
        background: #e68900;
    }

    .bus {
        display: grid;
        grid-template-columns: repeat(4, 50px);
        gap: 10px;
        justify-content: center;
    }

    .seat {
        width: 50px;
        height: 50px;
        background: #ccc;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    .seat:hover {
        background: #90caf9;
    }

    .seat.selected {
        background: #4caf50;
    }

    .seat.booked {
        background: #e53935;
        cursor: not-allowed;
    }

    .info {
        margin-top: 15px;
        text-align: center;
    }

    footer {
        text-align: center;
        padding: 10px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<header>🚌 Premium Bus Reservation System</header>

<div class="container">

    <!-- Booking Form -->
    <div class="card form-section">
        <h3>Booking Details</h3>
        <input type="text" id="name" placeholder="Passenger Name">
        <select id="from">
            <option>Coimbatore</option>
            <option>Chennai</option>
            <option>Bangalore</option>
        </select>
        <select id="to">
            <option>Chennai</option>
            <option>Madurai</option>
            <option>Hyderabad</option>
        </select>
        <input type="date" id="date">
        <button class="btn" onclick="confirmBooking()">Confirm Booking</button>
    </div>

    <!-- Seat Layout -->
    <div class="card">
        <h3>Select Your Seat</h3>
        <div class="bus" id="bus"></div>
        <div class="info">
            <p>Selected Seats: <span id="count">0</span></p>
            <p>Total Price: ₹<span id="total">0</span></p>
        </div>
    </div>

</div>

<footer>✨ Designed with modern UI effects</footer>

<script>
    const bus = document.getElementById('bus');
    const count = document.getElementById('count');
    const total = document.getElementById('total');

    const seatPrice = 250;

    // Create 32 seats
    for (let i = 1; i <= 32; i++) {
        const seat = document.createElement('div');
        seat.classList.add('seat');

        // Random booked seats
        if (Math.random() < 0.2) {
            seat.classList.add('booked');
        }

        seat.addEventListener('click', () => {
            if (!seat.classList.contains('booked')) {
                seat.classList.toggle('selected');
                update();
            }
        });

        bus.appendChild(seat);
    }

    function update() {
        const selectedSeats = document.querySelectorAll('.seat.selected');
        count.innerText = selectedSeats.length;
        total.innerText = selectedSeats.length * seatPrice;
    }

    function confirmBooking() {
        const name = document.getElementById('name').value;
        const selectedSeats = document.querySelectorAll('.seat.selected').length;

        if (!name || selectedSeats === 0) {
            alert("Please enter name and select seats!");
            return;
        }

        alert(`Booking Confirmed for ${name}\nSeats: ${selectedSeats}`);
    }
</script>

</body>
</html>
