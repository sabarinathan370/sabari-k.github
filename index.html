<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bus Ticket Reservation</title>
  <link rel="stylesheet" href="style.css">
  <style>
  body {
  font-family: Arial;
  text-align: center;
}

.form input {
  margin: 5px;
  padding: 8px;
}

#seats {
  display: grid;
  grid-template-columns: repeat(5, 50px);
  gap: 10px;
  justify-content: center;
  margin: 20px;
}

.seat {
  padding: 10px;
  border: 1px solid black;
  cursor: pointer;
}

.selected {
  background-color: green;
  color: white;
}

.booked {
  background-color: gray;
  color: white;
  cursor: not-allowed;
}
    </style>
</head>
<body>
  <script>
  let selectedSeats = [];
let bookedSeats = JSON.parse(localStorage.getItem("bookedSeats")) || [];

function generateSeats() {
  const seatContainer = document.getElementById("seats");
  seatContainer.innerHTML = "";

  for (let i = 1; i <= 20; i++) {
    const seat = document.createElement("div");
    seat.classList.add("seat");
    seat.innerText = i;

    if (bookedSeats.includes(i)) {
      seat.classList.add("booked");
    }

    seat.onclick = () => selectSeat(seat, i);
    seatContainer.appendChild(seat);
  }
}

function selectSeat(seat, num) {
  if (bookedSeats.includes(num)) return;

  if (selectedSeats.includes(num)) {
    selectedSeats = selectedSeats.filter(s => s !== num);
    seat.classList.remove("selected");
  } else {
    selectedSeats.push(num);
    seat.classList.add("selected");
  }
}

function bookSeats() {
  const name = document.getElementById("name").value;
  const from = document.getElementById("from").value;
  const to = document.getElementById("to").value;

  if (!name || selectedSeats.length === 0) {
    alert("Enter name and select seats");
    return;
  }

  bookedSeats = [...bookedSeats, ...selectedSeats];
  localStorage.setItem("bookedSeats", JSON.stringify(bookedSeats));

  const bookingList = document.getElementById("bookingList");

  const li = document.createElement("li");
  li.innerText = `${name} booked seats ${selectedSeats.join(", ")} (${from} → ${to})`;
  bookingList.appendChild(li);

  selectedSeats = [];
  generateSeats();
}

// Load seats on page load
generateSeats();
  </script>

<h1>🚌 Bus Ticket Reservation</h1>

<div class="form">
  <input type="text" id="name" placeholder="Your Name">
  <input type="text" id="from" placeholder="From">
  <input type="text" id="to" placeholder="To">
  <button onclick="generateSeats()">Search Bus</button>
</div>

<h2>Select Seats</h2>
<div id="seats"></div>

<button onclick="bookSeats()">Book Now</button>

<h2>Bookings</h2>
<ul id="bookingList"></ul>

<script src="script.js"></script>
</body>
</html>
